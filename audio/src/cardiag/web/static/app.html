<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Audio Intelligence</title>

<style>
body {
    font-family: system-ui, Arial, sans-serif;
    margin: 40px;
    background: #0b0f14;
    color: #e6edf3;
}

.container {
    max-width: 720px;
    margin: auto;
}

.card {
    background: #151b23;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

button {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #2f81f7;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1f6feb;
}

.status {
    margin-top: 15px;
    font-size: 14px;
    opacity: 0.85;
}

.result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #0d1117;
    white-space: pre-wrap;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    margin-bottom: 10px;
}

.ok { background: #238636; }
.warn { background: #d29922; }
.err { background: #f85149; }
</style>
</head>

<body>

<div class="container">

<h1>Audio Intelligence</h1>
<p>Upload a mechanical sound clip for AI analysis.</p>

<div class="card">
    <input type="file" id="audioFile" accept="audio/*" />
    <br />
    <button onclick="uploadAudio()">Upload & Diagnose</button>

    <div class="status" id="status"></div>

    <div class="result" id="result" style="display:none;"></div>
</div>

</div>

<script>
async function uploadAudio() {
    const file = document.getElementById("audioFile").files[0];
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    result.style.display = "none";
    result.textContent = "";

    if (!file) {
        alert("Please select an audio file");
        return;
    }

    status.textContent = "Uploading...";

    const form = new FormData();
    form.append("file", file);

    const res = await fetch("/api/diagnose/stream", {
        method: "POST",
        body: form
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";

    function handleEvent(type, data) {

        // IGNORE noisy internal pipeline events
        if (type === "meta" || type === "waveform" || type === "spectrogram") {
            return;
        }

        if (type === "status") {
            status.textContent = data.message;
        }

        if (type === "error") {
            status.innerHTML = `<span class="badge err">Error</span> ${data.message}`;
        }

        if (type === "result") {
            status.innerHTML = `<span class="badge ok">Complete</span>`;
            result.style.display = "block";

            result.textContent =
                "Diagnosis Result:\n\n" +
                JSON.stringify(data, null, 2);
        }
    }

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop();

        for (const chunk of parts) {

            const eventMatch = chunk.match(/^event:\s*(.*)$/m);
            const dataMatch = chunk.match(/^data:\s*(.*)$/m);

            if (!eventMatch || !dataMatch) continue;

            const type = eventMatch[1].trim();

            let data;
            try {
                data = JSON.parse(dataMatch[1]);
            } catch (e) {
                continue;
            }

            handleEvent(type, data);
        }
    }
}
</script>

</body>
</html>
