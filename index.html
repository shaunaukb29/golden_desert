<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
  }

  .shell { max-width: 600px; margin: 0 auto; }

  /* Header Overhaul */
  .header { text-align: center; margin-bottom: 40px; }
  .brand { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .sub-brand { color: var(--muted); font-size: 14px; }

  /* Card Overhaul */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    box-shadow: var(--shadow);
  }

  h2 { font-size: 18px; margin-bottom: 24px; color: var(--text); }

  /* Custom Form Elements */
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
  input, select, textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fcfcfc;
    font-family: inherit;
    font-size: 15px;
  }
  
  .btn-primary {
    width: 100%;
    background: var(--text);
    color: white;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .btn-primary:hover { opacity: 0.9; }

  /* Different Layout for Radio Options */
  .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .radio-option {
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
  }
  .radio-option.selected { border-color: var(--accent); background: #eff6ff; color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="brand">Carithm</div>
    <div class="sub-brand">Independent Repair Intelligence</div>
  </div>

  <div class="card">
    <h2>Vehicle Details</h2>
    <div class="field">
      <label>Vehicle Selection</label>
      <div style="display: flex; gap: 10px;">
        <select id="make"><option>Make</option></select>
        <select id="model"><option>Model</option></select>
      </div>
    </div>
    
    <div class="field">
      <label>Driving Pattern</label>
      <div class="radio-grid">
        <div class="radio-option selected" onclick="selectRadio(this)">Urban</div>
        <div class="radio-option" onclick="selectRadio(this)">Highway</div>
        <div class="radio-option" onclick="selectRadio(this)">Mixed</div>
        <div class="radio-option" onclick="selectRadio(this)">Desert</div>
      </div>
    </div>

    <div class="field">
      <label>Workshop Quote</label>
      <textarea id="quote-text" placeholder="Paste your service items here..."></textarea>
    </div>

    <button class="btn-primary" onclick="analyzeQuote()">Run Audit</button>
  </div>
</div>

<script>
  function selectRadio(el) {
    document.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }
</script>
</body>
</html>
