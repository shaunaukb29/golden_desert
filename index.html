<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carithm — Workshop Audit</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0b0b0f;
  --card:#151518;
  --card2:#1c1c21;
  --border:rgba(255,255,255,0.08);
  --text:#fafafa;
  --muted:#a1a1aa;
  --accent:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --r:12px;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: Inter, system-ui;
  background:var(--bg);
  color:var(--text);
  padding:40px 16px;
}

.container {
  max-width:720px;
  margin:0 auto;
}

h1 {
  font-size:28px;
  margin-bottom:6px;
}

p { color:var(--muted); }

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-top:16px;
}

label {
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

input, select, textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
}

textarea { min-height:120px; }

button {
  margin-top:12px;
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:disabled { opacity:.5; }

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.small { font-size:12px; color:var(--muted); }

.item {
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-top:8px;
}

.badge {
  display:inline-block;
  font-size:11px;
  padding:2px 6px;
  border-radius:999px;
  margin-top:4px;
}

.green { background:rgba(34,197,94,.15); color:var(--green); }
.red { background:rgba(239,68,68,.15); color:var(--red); }

.hidden { display:none; }

.status {
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="container">

  <h1>Carithm Audit</h1>
  <p>Upload or paste a workshop quote for analysis.</p>

  <!-- QUOTE INPUT -->
  <div class="card">
    <label>Quote text</label>
    <textarea id="quoteText" placeholder="Brake pads - AED 400"></textarea>

    <button id="analyzeBtn">Analyze Quote</button>
    <div class="status" id="status"></div>
  </div>

  <!-- VEHICLE -->
  <div class="card hidden" id="vehicleCard">
    <h3>Vehicle</h3>

    <div class="row">
      <div>
        <label>Make</label>
        <select id="make"></select>
      </div>

      <div>
        <label>Model</label>
        <select id="model"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Year</label>
        <input id="year" type="number" value="2021">
      </div>

      <div>
        <label>Mileage</label>
        <input id="mileage" type="number" value="80000">
      </div>
    </div>

    <label>Drivetrain</label>
    <select id="drivetrain">
      <option value="fwd">FWD</option>
      <option value="rwd">RWD</option>
      <option value="awd" selected>AWD</option>
    </select>
  </div>

  <!-- SERVICES -->
  <div class="card hidden" id="servicesCard">
    <h3>Detected Services</h3>
    <div id="services"></div>
  </div>

  <!-- HISTORY -->
  <div class="card hidden" id="historyCard">
    <h3>History Questions</h3>
    <div id="history"></div>

    <button id="reportBtn">Generate Report</button>
  </div>

  <!-- REPORT -->
  <div class="card hidden" id="reportCard">
    <h3>Report</h3>
    <pre id="report"></pre>
  </div>

</div>

<script>
const API = "http://127.0.0.1:8000";

let servicesData = [];
let historyAnswers = {};

/* ---------------- API ---------------- */
async function post(path, body) {
  const r = await fetch(API + path, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function get(path) {
  const r = await fetch(API + path);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------------- UI ---------------- */
function show(id) {
  document.getElementById(id).classList.remove("hidden");
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

/* ---------------- ANALYZE ---------------- */
document.getElementById("analyzeBtn").onclick = async () => {
  const text = document.getElementById("quoteText").value.trim();
  if(!text) return setStatus("Enter quote text");

  setStatus("Analyzing...");

  const res = await post("/analyze-quote-text", { text });

  servicesData = res.services || [];

  renderServices();
  renderHistory();

  show("vehicleCard");
  show("servicesCard");
  show("historyCard");

  setStatus("Analysis complete");
};

/* ---------------- SERVICES ---------------- */
function renderServices() {
  const el = document.getElementById("services");
  el.innerHTML = "";

  servicesData.forEach(s => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div><b>${s.display || s.raw}</b></div>
      <div class="small">Key: ${s.part_key || "UNMATCHED"}</div>
      <div class="small">AED ${s.price || 0}</div>
      <div class="badge ${s.part_key ? "green":"red"}">
        ${s.part_key ? "Matched" : "Unmatched"}
      </div>
    `;

    el.appendChild(div);
  });
}

/* ---------------- HISTORY ---------------- */
function renderHistory() {
  const el = document.getElementById("history");
  el.innerHTML = "";

  servicesData
    .filter(s => s.history_options?.length)
    .forEach(s => {

      const wrap = document.createElement("div");
      wrap.className = "item";

      const label = document.createElement("div");
      label.textContent = `When was "${s.display || s.raw}" last serviced?`;

      const select = document.createElement("select");
      select.innerHTML = `<option value="">Select</option>`;

      s.history_options.forEach(o => {
        const opt = document.createElement("option");

        if(Array.isArray(o)) {
          opt.textContent = o[0];
          opt.value = o[1];
        } else {
          opt.textContent = o.label;
          opt.value = o.value;
        }

        select.appendChild(opt);
      });

      select.onchange = () => {
        historyAnswers[s.part_key] = select.value;
      };

      wrap.appendChild(label);
      wrap.appendChild(select);
      el.appendChild(wrap);
    });
}

/* ---------------- REPORT ---------------- */
document.getElementById("reportBtn").onclick = async () => {
  const payload = {
    services: servicesData,
    history_answers: historyAnswers,
    make: document.getElementById("make").value,
    model: document.getElementById("model").value,
    year: Number(document.getElementById("year").value),
    mileage: Number(document.getElementById("mileage").value),
    driving: "mixed",
    drivetrain: document.getElementById("drivetrain").value,
    consent_to_log: false
  };

  setStatus("Generating report...");

  const res = await post("/generate-report", payload);

  document.getElementById("report").textContent = res.report || "";
  show("reportCard");

  setStatus("Done");
};

/* ---------------- LOAD MAKES ---------------- */
(async function init(){
  try {
    const makes = await get("/makes");

    const makeEl = document.getElementById("make");
    makeEl.innerHTML = "";

    makes.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      makeEl.appendChild(opt);
    });

    makeEl.onchange = async () => {
      const models = await get("/models/" + makeEl.value);

      const modelEl = document.getElementById("model");
      modelEl.innerHTML = "";

      models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        modelEl.appendChild(opt);
      });
    };

  } catch(e) {
    setStatus("Failed to load makes");
  }
})();
</script>

</body>
</html>
