<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carithm Auditor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    textarea, input { width: 100%; margin: 6px 0; padding: 8px; }
    button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
    pre { background: #111; color: #0f0; padding: 10px; overflow: auto; }
  </style>
</head>
<body>

<h2>Carithm Auditor</h2>

<label>Vehicle Make</label>
<input id="make" value="Mazda" />

<label>Vehicle Model</label>
<input id="model" value="CX-5/CX-9 2.5L" />

<label>Year</label>
<input id="year" value="2021" />

<label>Mileage</label>
<input id="mileage" value="128000" />

<label>Drivetrain</label>
<input id="drivetrain" value="awd" />

<label>Driving Pattern</label>
<input id="driving" value="mixed" />

<hr />

<label>Quote Text</label>
<textarea id="quote" rows="10">
3 FRONTBRAKE PADS 498
REAR BRAKE PADS 438
ENGINE OIL CHANGE 0
AC FILTER 149
</textarea>

<button onclick="analyzeQuote()">Analyze Quote</button>
<button onclick="generateReport()">Generate Report</button>

<pre id="output"></pre>

<script>
const API_BASE = "http://localhost:8000"; // change if needed

let analysisState = {
  services: [],
  history_answers: {}
};

function log(msg) {
  document.getElementById("output").textContent =
    typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
}

async function analyzeQuote() {
  const text = document.getElementById("quote").value;

  const payload = { text };

  const res = await fetch(`${API_BASE}/analyze-quote-text`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  analysisState.services = data.services || [];
  analysisState.history_answers = {};

  log(data);
}

async function generateReport() {
  const payload = {
    make: document.getElementById("make").value,
    model: document.getElementById("model").value,
    year: Number(document.getElementById("year").value),
    mileage: Number(document.getElementById("mileage").value),
    driving: document.getElementById("driving").value,
    drivetrain: document.getElementById("drivetrain").value,
    consent_to_log: true,

    services: analysisState.services,
    history_answers: analysisState.history_answers
  };

  const res = await fetch(`${API_BASE}/generate-report`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const text = await res.text();

  if (!res.ok) {
    log("ERROR " + res.status + "\n" + text);
    return;
  }

  try {
    log(JSON.parse(text));
  } catch {
    log(text);
  }
}
</script>

</body>
</html>
