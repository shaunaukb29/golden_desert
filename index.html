<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carithm — Workshop Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #111113; --surface2: #18181b; --surface3: #27272a;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
      --text: #fafafa; --muted: #71717a; --muted2: #52525b;
      --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.1); --accent-glow: rgba(59,130,246,0.18);
      --green: #22c55e; --green-dim: rgba(34,197,94,0.1); --red: #ef4444; --red-dim: rgba(239,68,68,0.1);
      --r: 10px; --r-sm: 7px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
    .shell { max-width: 680px; margin: 0 auto; padding: 44px 20px 100px; }

    /* Layout & Header */
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
    .logo { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .brand { font-size: 15px; font-weight: 600; }
    .hero { margin-bottom: 40px; }
    .eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
    .hero h1 { font-size: 32px; font-weight: 600; margin-bottom: 12px; }

    /* Components */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
    .card-head { padding: 16px 20px; font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--border); }
    .card-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
    input, select, textarea { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); color: var(--text); padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    
    .btn { padding: 11px 18px; border-radius: var(--r-sm); font-weight: 500; cursor: pointer; border: none; width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status-bar { padding: 9px 13px; border-radius: var(--r-sm); font-size: 12px; background: var(--accent-dim); border: 1px solid rgba(59,130,246,0.2); color: #93c5fd; display: flex; align-items: center; gap: 8px; }
    .hidden { display: none !important; }
    .spin { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: rotate 0.65s linear infinite; }
    @keyframes rotate { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" width="16" height="16"><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><path d="m15 14 2 2 4-4"/></svg></div>
    <span class="brand">Carithm</span>
  </div>

  <div class="hero">
    <div class="eyebrow">Workshop Audit</div>
    <h1>Is your quote fair?</h1>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="field"><label style="font-size:10px; color:var(--muted)">Brand</label><select id="make"><option value="">Select Brand</option></select></div>
      <div class="field"><label style="font-size:10px; color:var(--muted)">Quote Text</label><textarea id="quote-text" placeholder="Paste items..." rows="4"></textarea></div>
      <button class="btn btn-primary" id="analyze-btn" onclick="analyze()">Analyze quote</button>
      <div id="status" class="status-bar hidden"></div>
    </div>
  </div>

  <div id="history-review" class="card hidden">
    <div class="card-head">Clarify Details</div>
    <div class="card-body">
      <div id="questions-list"></div>
      <button class="btn btn-primary" id="finalize-btn" onclick="finalizeReport()">Get Final Audit</button>
    </div>
  </div>

  <div id="report"></div>
</div>

<script>
  const API = 'https://x748873y-bcvbc.hf.space';
  let currentServices = [];

  function status(msg, type = 'info') {
    const el = document.getElementById('status');
    if (!msg) { el.classList.add('hidden'); return; }
    el.innerHTML = `<div class="s-dot"></div><span>${msg}</span>`;
    el.classList.remove('hidden');
  }

  function normalize(item) {
    return {
      display: item.display || item.name || 'Service Item',
      part_key: item.part_key || 'UNKNOWN',
      price: Number(item.price || 0),
      needs_history: Boolean(item.needs_history ?? false)
    };
  }

  async function loadMakes() {
    try {
      const r = await fetch(`${API}/makes`);
      const data = await r.json();
      const sel = document.getElementById('make');
      (data.makes || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        sel.appendChild(opt);
      });
    } catch(e) { console.error(e); }
  }
  loadMakes();

  async function analyze() {
    const btn = document.getElementById('analyze-btn');
    const quoteText = document.getElementById('quote-text').value;
    if (!quoteText) return;
    
    btn.disabled = true;
    btn.innerHTML = '<div class="spin"></div> Analyzing...';
    
    try {
      const r = await fetch(`${API}/analyze-quote-text`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quote_text: quoteText })
      });
      const data = await r.json();
      currentServices = (data.services || []).map(normalize);

      const toAsk = currentServices.filter(s => s.needs_history);
      
      if (toAsk.length > 0) {
        status('Fetching context...');
        const questions = [];
        for (const s of toAsk) {
           const hr = await fetch(`${API}/history-options/${encodeURIComponent(s.part_key)}`);
           const hData = await hr.json();
           if (hData.questions) questions.push({ ...s, options: hData.questions });
        }
        renderQuestions(questions);
      } else {
        finalizeReport();
      }
    } catch(e) { status('Error: ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Analyze quote'; }
  }

  function renderQuestions(items) {
    const list = document.getElementById('questions-list');
    list.innerHTML = items.map(i => `
      <div style="margin-bottom:10px">
        <div style="font-size:12px; margin-bottom:5px">${i.display}</div>
        <select class="history-q" data-key="${i.part_key}">
          ${i.options.map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>
      </div>
    `).join('');
    document.getElementById('history-review').classList.remove('hidden');
    status(null);
  }

  async function finalizeReport() {
    const answers = {};
    document.querySelectorAll('.history-q').forEach(el => {
      answers[el.dataset.key] = el.value;
    });

    const btn = document.getElementById('finalize-btn');
    btn.disabled = true;
    btn.textContent = 'Generating...';

    try {
      const r = await fetch(`${API}/generate-report`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ services: currentServices, answers })
      });
      const report = await r.json();
      document.getElementById('report').innerHTML = `
        <div class="card" style="margin-top:20px">
          <div class="card-head">Audit Result</div>
          <div class="card-body">${report.summary || 'Audit complete.'}</div>
        </div>
      `;
      document.getElementById('history-review').classList.add('hidden');
    } catch(e) { status('Failed to generate report', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Get Final Audit'; }
  }
</script>
</body>
</html>
