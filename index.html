<script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.8.1/dist/index.js";

    // Initialize your live Hugging Face Space instance
    const hfSpaceUrl = "https://x748873y-bcvbc.hf.space";
    
    window.addEventListener("DOMContentLoaded", async () => {
        console.log("Connecting platform front-end to Carithm intelligence backend...");
        try {
            window.carithmApp = await Client.connect(hfSpaceUrl);
            console.log("Connected to Carithm backend engine successfully.");
        } catch (err) {
            console.error("Failed to connect to Hugging Face space:", err);
        }
    });

    // Make execution available to your frontend UI button actions
    window.runLiveAuditPipeline = async function(payloadArray) {
        if (!window.carithmApp) {
            alert("Backend connection initializing. Please try again in a moment.");
            return null;
        }
        
        // Executes the transaction against your live backend space
        // Gradio tracks events by sequential layout index or function index
        const response = await window.carithmApp.predict(4, payloadArray); 
        return response.data;
    };
</script>
